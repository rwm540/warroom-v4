name: Deploy WarRoom

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: warroom-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: validate
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Deploy on server
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR=/opt/apps/warroom-v4

          if [ ! -d "$APP_DIR/.git" ]; then
            mkdir -p "$(dirname "$APP_DIR")"
            git clone --branch main --depth 1 https://github.com/rwm540/warroom-v4.git "$APP_DIR"
          fi

          cd "$APP_DIR"

          git fetch origin main
          git reset --hard origin/main

          docker compose build --pull
          docker compose up -d

          docker compose ps
