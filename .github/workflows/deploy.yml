name: Deploy WarRoom

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/warroom_deploy
          chmod 600 ~/.ssh/warroom_deploy

          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/warroom_deploy             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes             "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          APP_DIR=/opt/apps/warroom-v4

          if [ ! -d "$APP_DIR/.git" ]; then
            mkdir -p "$(dirname "$APP_DIR")"
            git clone --branch main --depth 1 https://github.com/rwm540/warroom-v4.git "$APP_DIR"
          fi

          cd "$APP_DIR"

          git fetch origin main
          git reset --hard origin/main

          docker compose build --pull
          docker compose up -d

          docker compose ps
          REMOTE
