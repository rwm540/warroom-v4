services:
  redis:
    image: redis:7-alpine
    container_name: warroom-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required - no default allowed}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    environment:
      # Use REDISCLI_AUTH to avoid password in process args for healthcheck
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - warroom-private
    healthcheck:
      # Use env var REDISCLI_AUTH instead of -a to avoid leaking password in ps
      test: ["CMD-SHELL", "redis-cli --raw ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # No ports exposed to host - internal only
    # Security: no default password, no public port, noeviction prevents silent counter eviction

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: warroom-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4010
      HOST: 0.0.0.0
      TRUST_PROXY: 1
      # Comma-separated public HTTPS origins allowed to call state-changing API routes.
      # Set this to the final website origin, e.g. https://warroom.example.com
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      OTP_CHALLENGE_SECRET: ${OTP_CHALLENGE_SECRET:?OTP_CHALLENGE_SECRET is required}
      OTP_SECRET: ${OTP_SECRET:?OTP_SECRET is required}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      OTP_MAX_SEND_PER_15MIN: ${OTP_MAX_SEND_PER_15MIN:-3}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      OTP_MAX_VERIFY_ATTEMPTS: ${OTP_MAX_VERIFY_ATTEMPTS:-5}
      IPPANEL_API_KEY: ${IPPANEL_API_KEY:-}
      IPPANEL_FROM_NUMBER: ${IPPANEL_FROM_NUMBER:-}
      IPPANEL_API_URL: ${IPPANEL_API_URL:-https://edge.ippanel.com/v1/api/send}
      PASSWORD_RESET_RATE_LIMIT_PER_HOUR: ${PASSWORD_RESET_RATE_LIMIT_PER_HOUR:-3}
      REGISTRATION_RATE_LIMIT_PER_HOUR: ${REGISTRATION_RATE_LIMIT_PER_HOUR:-5}
      # Redis internal service name, not localhost, no default password
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # Session security
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    networks:
      - warroom-private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4010/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # API not exposed to host - only via web proxy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?VITE_SUPABASE_URL is required}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_SUPABASE_PUBLIC_KEY: ${VITE_SUPABASE_PUBLIC_KEY:-}
    container_name: warroom-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # web does NOT depend on redis - architecture separation
    ports:
      - "${WEB_PORT:-127.0.0.1:3100:8080}"
    networks:
      - warroom-private
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  warroom-private:
    driver: bridge

volumes:
  redis_data:
    driver: local
    # Persists AOF for rate limit counters
    # Data is ephemeral, hashed PII keys only, no sensitive data
    # For full reset: docker compose down -v (WARNING: deletes rate limit history)
