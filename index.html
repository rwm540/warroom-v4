<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/images/logos/warroom_logo_sm.webp" />
    <title>اتاق جنگ | سامانه فرماندهی و عملیات</title>
    <meta name="description" content="سامانه یکپارچه مأموریت‌ها، آموزش‌ها، ویترین آثار و امتیازات اتاق جنگ" />
    <meta property="og:title" content="اتاق جنگ | سامانه فرماندهی و عملیات" />
    <meta property="og:description" content="سامانه یکپارچه مأموریت‌ها، آموزش‌ها، ویترین آثار و امتیازات اتاق جنگ" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/logos/warroom_logo.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#030610" />

    <!-- High Performance Asset Preloading -->
    <link rel="preload" as="image" href="/images/logos/warroom_logo.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/banners/boys_registration_banner.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/banners/boys_registration_banner_mobile.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/banners/girls_registration_banner.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/banners/girls_registration_banner_mobile.webp" fetchpriority="high" />

    <script>
      // Immediate image preloader for zero-delay rendering
      (function() {
        const imgs = [
          '/images/logos/warroom_logo.webp',
          '/images/banners/boys_registration_banner.webp',
          '/images/banners/boys_registration_banner_mobile.webp',
          '/images/banners/girls_registration_banner.webp',
          '/images/banners/girls_registration_banner_mobile.webp'
        ];
        imgs.forEach(function(src) {
          const img = new Image();
          img.src = src;
        });
      })();
    </script>

    <!-- High Performance Font Loading: Preconnect + Display Swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" />
    </noscript>
  </head>
  <body class="bg-[#030610] text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
